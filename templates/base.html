<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#14120f">
  <title>{% block title %}rdspan{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="top">
    <div class="brand-block">
      <a class="brand" href="/">rdspan</a>
      <p class="tag">Ranieri–Dowling · español</p>
    </div>
    <nav class="top-nav" aria-label="Secciones">
      <a class="btn primary" href="/">Tablas</a>
      <a class="btn primary" href="/tiempos">Tiempos</a>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
