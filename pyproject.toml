[project]
name = "rdspan"
version = "0.1.0"
description = "Spanish learning app using the Ranieri–Dowling method"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "piper-tts>=1.3.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
rdspan = "rdspan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["rdspan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
